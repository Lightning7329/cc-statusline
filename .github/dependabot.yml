version: 2
updates:
  # 配布バイナリに含まれるランタイム依存
  - package-ecosystem: nuget
    directory: /src/StatusLine
    schedule:
      interval: weekly
      day: saturday
      time: "00:00"
      timezone: Asia/Tokyo
    commit-message:
      prefix: "chore(deps)"
    # .config/dotnet-tools.json はどの directory からも検出されるため、
    # 開発ツールはテストプロジェクト側のエントリ（chore(dev-deps)）だけで更新する
    ignore:
      - dependency-name: fantomas
      - dependency-name: dotnet-reportgenerator-globaltool
    groups:
      runtime:
        update-types:
          - minor
          - patch

  # テスト実行基盤と .config/dotnet-tools.json の開発ツール
  - package-ecosystem: nuget
    directory: /src/StatusLine.Tests
    schedule:
      interval: weekly
      day: saturday
      time: "00:00"
      timezone: Asia/Tokyo
    commit-message:
      prefix: "chore(dev-deps)"
    groups:
      dev-dependencies:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "00:00"
      timezone: Asia/Tokyo
    commit-message:
      prefix: "chore(dev-deps)"
    # workflow の変更は auto-merge できず手動マージになるため、メジャー更新も含めて 1 本にまとめる
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "00:00"
      timezone: Asia/Tokyo
    commit-message:
      prefix: "chore(dev-deps)"
    groups:
      devcontainers:
        patterns:
          - "*"
